name: Build Windows app

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/camfrog-status-changer/**'

permissions:
  contents: read

jobs:
  test-build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/camfrog-status-changer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt pytest pyinstaller
      - run: python -m pytest -q
      - run: python -m compileall -q .
      - run: python -m PyInstaller --clean --noconfirm --onefile --windowed --name CamfrogStatusChanger app.py
