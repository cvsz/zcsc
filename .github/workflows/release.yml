name: Release

# Publishes the RC13 Windows candidate from a tag. The build is reused from the
# "Camfrog Status Changer" workflow artifact for the exact same commit, so the
# released binary is the identical Defender-scanned artifact, not a rebuild.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release for the pushed tag
      id-token: write # required by attest-build-provenance
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read source version
        id: version
        shell: bash
        run: |
          version=$(sed -n 's/^VERSION = "\(.*\)"$/\1/p' version.py)
          if [ -z "$version" ]; then
            echo 'Could not read VERSION from version.py' >&2
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match source version v$version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Require a successful Windows build for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # The release job reuses the artifact from the Camfrog Status Changer
          # workflow. Refuse to publish unless that workflow succeeded on this
          # exact commit, so no unverified or stale binary is released.
          run_id=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow "camfrog-status-changer.yml" \
            --branch "$GITHUB_REF_NAME" \
            --commit "$GITHUB_SHA" \
            --status success \
            --limit 1 \
            --json databaseId --jq '.[0].databaseId')
          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "No successful Camfrog Status Changer run found for $GITHUB_SHA" >&2
            exit 1
          fi
          echo "Using verified build run $run_id"

      - name: Download the verified Windows artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run_id=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow "camfrog-status-changer.yml" \
            --branch "$GITHUB_REF_NAME" \
            --commit "$GITHUB_SHA" \
            --status success \
            --limit 1 \
            --json databaseId --jq '.[0].databaseId')
          mkdir -p release-assets
          gh run download "$run_id" \
            --repo "$GITHUB_REPOSITORY" \
            --name CamfrogStatusChanger-windows-x64 \
            --dir release-assets
          ls -R release-assets

      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/dist/CamfrogStatusChanger.exe

      - name: Create pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Camfrog Status Changer ${{ steps.version.outputs.version }}" \
            --prerelease \
            --verify-tag \
            release-assets/dist/CamfrogStatusChanger.exe \
            release-assets/dist/release-manifest.json \
            release-assets/artifacts/windows-artifact-verification.json \
            release-assets/artifacts/windows-defender-status.json \
            release-assets/artifacts/windows-defender-scan.txt
