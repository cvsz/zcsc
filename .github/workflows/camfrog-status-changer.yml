name: Camfrog Status Changer

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-build.lock
      - name: Test and build Windows executable
        run: python scripts/build_windows.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: CamfrogStatusChanger-windows-x64
          path: |
            dist/CamfrogStatusChanger.exe
            dist/release-manifest.json
          if-no-files-found: error
          retention-days: 7
