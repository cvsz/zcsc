name: Camfrog Status Changer

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pytest pyinstaller==6.22.3
      - name: Tests
        run: python -m pytest -q
      - name: Compile check
        run: python -m compileall -q app.py automation camfrog system ui version.py self_test.py
      - name: Build Windows executable
        run: python -m PyInstaller --clean --noconfirm --onefile --windowed --exclude-module PIL._avif --name CamfrogStatusChanger --icon app.ico --add-data "app.ico;." --add-data "bad_word_starters.json;." app.py
      - name: Release manifest
        shell: pwsh
        run: ./release_manifest.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: CamfrogStatusChanger-windows-x64
          path: |
            dist/CamfrogStatusChanger.exe
            dist/release-manifest.json
          if-no-files-found: error
          retention-days: 7
