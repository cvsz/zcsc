name: Camfrog Status Changer

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-build.lock
      - name: Test and build Windows executable
        run: python scripts/build_windows.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: CamfrogStatusChanger-windows-x64
          path: |
            dist/CamfrogStatusChanger.exe
            dist/release-manifest.json
          if-no-files-found: error
          retention-days: 7
