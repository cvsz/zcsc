name: Camfrog Status Changer

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-build.lock
      - name: Test and build Windows executable
        run: python scripts/build_windows.py

      - name: Verify executable hash, manifest and PE x64 format
        run: python scripts/verify_windows_artifact.py

      - name: Scan executable with Microsoft Defender
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Get-MpComputerStatus |
            Select-Object AMServiceEnabled, AntivirusEnabled, AntispywareEnabled, RealTimeProtectionEnabled, AntivirusSignatureVersion, AntivirusSignatureLastUpdated |
            ConvertTo-Json | Set-Content -Encoding utf8 artifacts/windows-defender-status.json

          $platformRoot = Join-Path $env:ProgramData 'Microsoft\Windows Defender\Platform'
          $mpcmd = $null
          if (Test-Path $platformRoot) {
            $latest = Get-ChildItem $platformRoot -Directory |
              Sort-Object Name -Descending |
              Select-Object -First 1
            if ($latest) {
              $candidate = Join-Path $latest.FullName 'MpCmdRun.exe'
              if (Test-Path $candidate) { $mpcmd = $candidate }
            }
          }
          if (-not $mpcmd) {
            $candidate = Join-Path $env:ProgramFiles 'Windows Defender\MpCmdRun.exe'
            if (Test-Path $candidate) { $mpcmd = $candidate }
          }
          if (-not $mpcmd) {
            throw 'Microsoft Defender MpCmdRun.exe was not found on the Windows runner.'
          }

          $exe = (Resolve-Path 'dist/CamfrogStatusChanger.exe').Path
          & $mpcmd -Scan -ScanType 3 -File $exe -DisableRemediation 2>&1 |
            Tee-Object -FilePath artifacts/windows-defender-scan.txt
          if ($LASTEXITCODE -ne 0) {
            throw "Microsoft Defender scan failed or found an unremediated detection (exit $LASTEXITCODE)."
          }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: CamfrogStatusChanger-windows-x64
          path: |
            dist/CamfrogStatusChanger.exe
            dist/release-manifest.json
            artifacts/windows-artifact-verification.json
            artifacts/windows-defender-status.json
            artifacts/windows-defender-scan.txt
          if-no-files-found: error
          retention-days: 7
