name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-build.lock

      - name: Validate repository structure and Markdown links
        run: python3 scripts/validate_repo.py

      - name: Install application test dependencies
        run: python -m pip install --require-hashes -r requirements-build.lock

      - name: Run application and repository tests
        run: |
          mkdir -p artifacts
          python -m pytest -q --junitxml=artifacts/pytest-results.xml

      - name: Compile application and build scripts
        run: python -m compileall -q app.py automation camfrog system ui scripts version.py self_test.py

      - name: Audit pinned application dependencies
        run: python -m pip_audit -r requirements-build.lock

      - name: Check for common secret file names
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(\.env|id_rsa|id_ed25519|.*\.pem|.*\.key)$' | grep -v '^\.env\.example$'; then
            echo 'Potential secret-bearing file is tracked.'
            exit 1
          fi

      - name: Validate YAML syntax
        shell: bash
        run: |
          ruby -e 'require "yaml"; Dir.glob(".github/**/*.{yml,yaml}").each { |f| YAML.load_file(f); puts "ok #{f}" }'

      - name: Upload Ubuntu test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zcsc-ubuntu-test-report
          path: artifacts/pytest-results.xml
          if-no-files-found: warn
          retention-days: 7
